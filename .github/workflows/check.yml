name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hvac_boq
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hvac_boq_test
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      APP_URL: http://localhost:3000
      GMAIL_TOKEN_KEY: ${{ secrets.CI_GMAIL_TOKEN_KEY }}
      STORAGE_DIR: ${{ github.workspace }}/.ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Create the test database
        run: |
          psql "$DB_ADMIN_URL" -c 'CREATE DATABASE hvac_boq_test ENCODING UTF8 TEMPLATE template0'
          DATABASE_URL="$TEST_DATABASE_URL" DB_ADMIN_URL="$DB_ADMIN_URL" npm run db:setup:test
      - run: npm run test:db
      - run: npm run build
